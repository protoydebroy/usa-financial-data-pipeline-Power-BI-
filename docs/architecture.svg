<text x="56" y="388" font-size="11" font-weight="700" fill="#7E22CE" letter-spacing="1">STAGE 2 — TRANSFER</text>
<text x="56" y="406" font-size="11" fill="#6B6B6B">Microsoft Power Automate · Cloud workflow</text>

<g filter="url(#shadow)">
<rect x="100" y="424" width="240" height="46" rx="6" fill="#FFFFFF" stroke="#7E22CE" stroke-width="1.2"/>
<text x="220" y="442" font-size="12" font-weight="600" fill="#1A1A1A" text-anchor="middle">Trigger: New email (V2)</text>
<text x="220" y="458" font-size="10" fill="#6B6B6B" text-anchor="middle">Watches FinanceVault folder</text>
</g>

<g filter="url(#shadow)">
<rect x="380" y="424" width="240" height="46" rx="6" fill="#FFFFFF" stroke="#7E22CE" stroke-width="1.2"/>
<text x="500" y="442" font-size="12" font-weight="600" fill="#1A1A1A" text-anchor="middle">For each attachment</text>
<text x="500" y="458" font-size="10" fill="#6B6B6B" text-anchor="middle">Loops through every file in mail</text>
</g>

<line x1="340" y1="447" x2="376" y2="447" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

