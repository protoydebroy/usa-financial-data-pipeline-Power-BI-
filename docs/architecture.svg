<rect x="452" y="1228" width="116" height="44" rx="4" fill="#FFFFFF" stroke="#D97706" stroke-width="0.6"/>
<text x="510" y="1248" font-size="11" font-weight="600" fill="#1A1A1A" text-anchor="middle">Insights</text>
<text x="510" y="1262" font-size="9" fill="#6B6B6B" text-anchor="middle">5 takeaways</text>
