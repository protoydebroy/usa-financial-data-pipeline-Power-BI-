<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1320" role="img" aria-labelledby="title desc" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
<title id="title">USA Financial Data Pipeline Architecture</title>
<desc id="desc">End-to-end automation flow from Microsoft Outlook through Power Automate, Google Drive, Google Cloud, and a Python script into Power BI dashboard.</desc>

<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M2 1 L8 5 L2 9" fill="none" stroke="#475569" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
<feGaussianBlur in="SourceAlpha" stdDeviation="2"/>
<feOffset dx="0" dy="2" result="offsetblur"/>
<feComponentTransfer><feFuncA type="linear" slope="0.12"/></feComponentTransfer>
<feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>

<rect x="0" y="0" width="720" height="1320" fill="#F7F7F5"/>

<text x="40" y="44" font-size="22" font-weight="700" fill="#1A1A1A">USA Financial Data Pipeline</text>
<text x="40" y="64" font-size="12" fill="#6B6B6B">End-to-end automation: Outlook → Power Automate → Google Drive → Power BI</text>
<line x1="40" y1="80" x2="680" y2="80" stroke="#E5E5E5" stroke-width="1"/>

<g>
<rect x="40" y="104" width="640" height="208" rx="6" fill="#FFFFFF" stroke="#DBE5F0" stroke-width="1"/>
<rect x="40" y="104" width="4" height="208" fill="#1F4E79"/>
<text x="56" y="128" font-size="11" font-weight="700" fill="#1F4E79" letter-spacing="1">STAGE 1 — RECEIVE &amp; SEGREGATE</text>
<text x="56" y="146" font-size="11" fill="#6B6B6B">Microsoft Outlook · Rule-based mail routing</text>

<g filter="url(#shadow)">
<rect x="240" y="164" width="240" height="48" rx="6" fill="#FFFFFF" stroke="#94A3B8" stroke-width="1"/>
<text x="360" y="184" font-size="13" font-weight="600" fill="#1A1A1A" text-anchor="middle">Field agents</text>
<text x="360" y="202" font-size="11" fill="#6B6B6B" text-anchor="middle">~25 senders, daily mails with attachments</text>
</g>

<line x1="360" y1="212" x2="360" y2="244" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

<g filter="url(#shadow)">
<rect x="240" y="248" width="240" height="48" rx="6" fill="#FFFFFF" stroke="#1F4E79" stroke-width="1.4"/>
<text x="360" y="268" font-size="13" font-weight="600" fill="#1F4E79" text-anchor="middle">Outlook · FinanceVault folder</text>
<text x="360" y="285" font-size="11" fill="#6B6B6B" text-anchor="middle">Rule auto-routes by keyword "Credit Score"</text>
</g>
</g>

<g>
<line x1="360" y1="324" x2="360" y2="356" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
</g>

<g>
<rect x="40" y="364" width="640" height="208" rx="6" fill="#FFFFFF" stroke="#E1D6EE" stroke-width="1"/>
