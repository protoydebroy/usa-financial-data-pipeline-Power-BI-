<text x="360" y="518" font-size="12" font-weight="600" fill="#1A1A1A" text-anchor="middle">Action: Create file</text>
<text x="360" y="534" font-size="10" fill="#6B6B6B" text-anchor="middle">Name and content mapped to Drive</text>
</g>

<line x1="500" y1="472" x2="430" y2="498" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
</g>

<g>
<line x1="360" y1="584" x2="360" y2="616" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
</g>

<g>
<rect x="40" y="624" width="640" height="208" rx="6" fill="#FFFFFF" stroke="#CFE9E5" stroke-width="1"/>
