<text x="56" y="926" font-size="11" fill="#6B6B6B">Python script · Power BI Python connector</text>

<g filter="url(#shadow)">
<rect x="240" y="944" width="240" height="46" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
<text x="360" y="962" font-size="12" font-weight="600" fill="#1A1A1A" text-anchor="middle">List + download files</text>
<text x="360" y="978" font-size="10" fill="#6B6B6B" text-anchor="middle">Drive API v3 + requests + pandas</text>
</g>

<line x1="360" y1="990" x2="360" y2="1022" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

<g filter="url(#shadow)">
<rect x="240" y="1026" width="240" height="46" rx="6" fill="#FFFFFF" stroke="#D97706" stroke-width="1.2"/>
<text x="360" y="1044" font-size="12" font-weight="600" fill="#1A1A1A" text-anchor="middle">Combine into combined_df</text>
<text x="360" y="1060" font-size="10" fill="#6B6B6B" text-anchor="middle">pd.concat across all files</text>
</g>
