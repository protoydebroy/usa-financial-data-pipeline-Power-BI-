<text x="56" y="666" font-size="11" fill="#6B6B6B">Google Drive · Google Cloud service account</text>

<g filter="url(#shadow)">
<rect x="100" y="684" width="240" height="46" rx="6" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.2"/>
<text x="220" y="702" font-size="12" font-weight="600" fill="#1A1A1A" text-anchor="middle">Drive: Financial Project folder</text>
<text x="220" y="718" font-size="10" fill="#6B6B6B" text-anchor="middle">Holds CSV / Excel attachments</text>
</g>

<g filter="url(#shadow)">
<rect x="380" y="684" width="240" height="46" rx="6" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.2"/>
<text x="500" y="702" font-size="12" font-weight="600" fill="#1A1A1A" text-anchor="middle">Service account + JSON key</text>
<text x="500" y="718" font-size="10" fill="#6B6B6B" text-anchor="middle">Drive API · read-only scope</text>
</g>

<line x1="340" y1="707" x2="376" y2="707" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>

<g filter="url(#shadow)">
<rect x="240" y="760" width="240" height="46" rx="6" fill="#FFFAEC" stroke="#D97706" stroke-width="1.2"/>
<text x="360" y="778" font-size="12" font-weight="600" fill="#854F0B" text-anchor="middle">Folder shared with service email</text>
<text x="360" y="794" font-size="10" fill="#854F0B" text-anchor="middle">Required for programmatic access</text>
</g>

<line x1="500" y1="732" x2="430" y2="758" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
</g>

<g>
<line x1="360" y1="844" x2="360" y2="876" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
